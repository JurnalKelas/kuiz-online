<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenerator Pro - Ujian Online & Lembar Kerja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            html, body, #app, main, section {
                background: white !important;
                color: black !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
                position: static !important;
                display: block !important;
                float: none !important;
                box-shadow: none !important;
            }
            .no-print, header, aside, .modal-backdrop, button { 
                display: none !important; 
            }
            .print-area { 
                box-shadow: none !important; 
                margin: 0 !important; 
                width: 100% !important; 
                max-width: 100% !important;
                padding: 0 !important;
                border: none !important;
                display: block !important;
            }
            .page-break-inside-avoid { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="app"></div>

    <script>
        const QUESTION_TYPES = [
            {
                category: "Pilihan & Logika",
                items: [
                    { id: 'mc', label: '1. Pilihan Ganda (Multiple Choice)', hint: 'Soal | Opsi A | Opsi B | Opsi C | Opsi D | Kunci(A/B/C/D)' },
                    { id: 'tf', label: '2. Benar atau Salah (True / False)', hint: 'Pernyataan benar atau salah per baris' },
                    { id: 'tf_correct', label: '3. Benar/Salah + Alasan Pembetulan', hint: 'Pernyataan salah yang harus dikoreksi siswa' },
                    { id: 'odd_out', label: '4. Cari Kata Berbeda (Odd One Out)', hint: 'Kata1, Kata2, Kata3, KataBerbeda' },
                ]
            },
            {
                category: "Isian & Melengkapi",
                items: [
                    { id: 'fill', label: '5. Isian Singkat (Fill in the Blank)', hint: 'Kalimat dengan bagian kosong ________.' },
                    { id: 'cloze', label: '6. Teks Rumpang (Cloze Test)', hint: 'Paragraf cerita dengan titik-titik (1)_______' },
                    { id: 'short_answer', label: '7. Pertanyaan Singkat (Short Answer)', hint: 'Pertanyaan singkat per baris' },
                    { id: 'essay', label: '8. Uraian / Essay', hint: 'Pertanyaan essay yang membutuhkan penjelasan' },
                ]
            },
            {
                category: "Mencocokkan & Mengurutkan",
                items: [
                    { id: 'matching', label: '9. Menjodohkan (Matching)', hint: 'Sisi Kiri - Sisi Kanan' },
                    { id: 'sequencing', label: '10. Mengurutkan Kejadian (Sequencing)', hint: 'Langkah/kejadian acak per baris' },
                    { id: 'rearrange', label: '11. Menyusun Kata Acak (Rearrange Words)', hint: 'kata1 - kata2 - kata3 - kata4' },
                ]
            },
            {
                category: "Percakapan & Teks",
                items: [
                    { id: 'dialogue_comp', label: '12. Melengkapi Percakapan (Dialogue)', hint: 'A: Halo!\nB: ________' },
                    { id: 'dialogue_order', label: '13. Mengurutkan Dialog Acak', hint: 'Kalimat percakapan yang diacak' },
                    { id: 'reading', label: '14. Pemahaman Bacaan (Reading Text)', hint: 'Teks Bacaan...\n---\nSoal 1\nSoal 2' },
                ]
            },
            {
                category: "Grammar & Kosakata",
                items: [
                    { id: 'error_id', label: '15. Identifikasi Kesalahan Kalimat', hint: 'Kalimat dengan kata salah dalam [kurung]' },
                    { id: 'transform', label: '16. Transformasi Kalimat', hint: 'Kalimat dasar (Instruksi perubahan)' },
                    { id: 'word_form', label: '17. Pembentukan Kata (Word Form)', hint: 'Kalimat ________ (kata dasar)' },
                    { id: 'syn_ant', label: '18. Sinonim & Antonim', hint: 'Kata Utama - [Sinonim / Antonim]' },
                    { id: 'vocab', label: '19. Kosakata & Definisi', hint: 'Kosakata : Definisi singkat' },
                    { id: 'word_search', label: '20. Acak Kata / Anagram', hint: 'KATAACAK (Kata Asli)' },
                ]
            },
            {
                category: "Media & Soal Spesial",
                items: [
                    { id: 'picture', label: '21. Soal Berbasis Gambar', hint: 'Pertanyaan pengamatan gambar' },
                    { id: 'listening', label: '22. Soal Menyimak (Listening)', hint: 'Pertanyaan berdasarkan audio track' },
                    { id: 'speaking', label: '23. Instruksi Bicara (Speaking Test)', hint: 'Topik / Tugas bicara siswa' },
                    { id: 'info_gap', label: '24. Melengkapi Tabel Informasi', hint: 'Data1 - Data2 - Data3 (Gunakan ____)' },
                    { id: 'math_logic', label: '25. Soal Cerita Matematika / Logika', hint: 'Soal hitungan atau penalaran matematika' },
                ]
            }
        ];

        let state = {
            mode: 'teacher',
            type: 'mc',
            subject: 'Bahasa Indonesia / Umum',
            topic: 'Pemahaman Teks dan Evaluasi Membaca',
            instructions: 'Jawablah pertanyaan-pertanyaan di bawah ini dengan teliti dan benar!',
            text: '',
            timeLimit: 15,
            teacherWhatsApp: '628123456789',
            rawShareUrl: '',
            showModal: false,
            studentQuiz: null,
            studentName: '',
            studentClass: '',
            studentAnswers: {},
            timeRemaining: 0,
            timerInterval: null,
            scoreResult: null
        };

        window.appState = state;

        function generateAutoQuestions() {
            const subject = state.subject || 'Pelajaran';
            const topic = state.topic || 'Materi Pembelajaran';
            const type = state.type;

            let lines = [];
            for (let i = 1; i <= 25; i++) {
                if (type === 'mc') {
                    lines.push(`Pertanyaan nomor ${i} mengenai ${topic} dalam mata pelajaran ${subject}? | Pilihan A yang relevan | Pilihan B yang relevan | Pilihan C yang relevan | Pilihan D yang relevan | A`);
                } else if (type === 'matching') {
                    lines.push(`Istilah kunci ${i} tentang ${topic} - Definisi atau pasangan yang sesuai untuk nomor ${i}`);
                } else if (type === 'tf') {
                    lines.push(`Pernyataan ${i} terkait konsep ${topic} bernilai benar atau salah.`);
                } else {
                    lines.push(`Pertanyaan ${i} untuk mengevaluasi pemahaman siswa pada materi ${topic}?`);
                }
            }
            state.text = lines.join('\n');
            render();
        }

        function init() {
            generateAutoQuestions();

            const params = new URLSearchParams(window.location.search);
            const rawQ = params.get('q');
            const rawZ = params.get('z');
            const targetQ = rawQ || rawZ;
            
            let decodedObj = null;

            if (targetQ) {
                try {
                    const qData = targetQ.replace(/ /g, '+');
                    decodedObj = JSON.parse(decodeURIComponent(atob(qData)));
                } catch (e) {
                    console.error("Gagal dekode q:", e);
                }
            }

            if (decodedObj) {
                state.studentQuiz = decodedObj;
                state.timeRemaining = (decodedObj.time || 15) * 60;
                state.mode = 'student_start';
            }
            
            render();
        }

        window.setType = function(type) {
            state.type = type;
            generateAutoQuestions();
        }

        window.generate25Auto = function() {
            generateAutoQuestions();
        }

        window.updateText = function(text) {
            state.text = text;
            renderPreviewOnly();
        }

        window.generateLink = function() {
            const quizPayload = {
                type: state.type,
                subject: state.subject,
                topic: state.topic,
                text: state.text,
                time: Number(state.timeLimit) || 15,
                wa: state.teacherWhatsApp.replace(/[^0-9]/g, '')
            };
            
            const encodedStr = btoa(encodeURIComponent(JSON.stringify(quizPayload)));
            const shareUrl = `${window.location.origin}${window.location.pathname}?q=${encodedStr}`;
            
            state.rawShareUrl = shareUrl;
            state.showModal = true;
            render();
        }

        window.copyLink = function() {
            const input = document.createElement('textarea');
            input.value = state.rawShareUrl;
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                const msg = document.getElementById('copy-feedback');
                if (msg) {
                    msg.innerText = '✅ Link berhasil disalin! Silakan bagikan ke WhatsApp siswa.';
                    setTimeout(() => { msg.innerText = ''; }, 4000);
                }
            } catch (err) {
                alert('Gagal menyalin otomatis. Silakan salin manual.');
            }
            document.body.removeChild(input);
        }

        window.triggerPrint = function() {
            window.print();
        }

        window.startExam = function() {
            if (!state.studentName.trim() || !state.studentClass.trim()) {
                const errBox = document.getElementById('exam-error');
                if (errBox) errBox.innerText = "Harap masukkan Nama Lengkap dan Kelas Anda terlebih dahulu!";
                return;
            }
            state.mode = 'student_exam';
            render();
            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                if (state.timeRemaining <= 0) {
                    clearInterval(state.timerInterval);
                    window.submitExam();
                } else {
                    renderTimerOnly();
                }
            }, 1000);
        }

        window.submitExam = function() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const lines = state.studentQuiz.text.split('\n').filter(l => l.trim() !== '' && !l.startsWith('---'));
            let correct = 0;
            let totalEvaluated = 0;

            lines.forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                    totalEvaluated++;
                    const key = parts[5] ? parts[5].toUpperCase() : '';
                    if (state.studentAnswers[idx] === key) correct++;
                }
            });

            const total = totalEvaluated > 0 ? totalEvaluated : lines.length;
            const score = total > 0 ? Math.round((correct / total) * 100) : 100;
            state.scoreResult = { correct, total, score };
            state.mode = 'result';
            render();
        }

        window.sendScoreToWhatsApp = function() {
            const waNumber = state.studentQuiz.wa;
            const msg = `Halo Bapak/Ibu Guru, saya telah menyelesaikan kuis:\n\n👤 Nama: ${state.studentName}\n🏫 Kelas: ${state.studentClass}\n📚 Mapel: ${state.studentQuiz.subject}\n📌 Topik: ${state.studentQuiz.topic}\n🏆 Nilai Akhir: *${state.scoreResult.score}* (Benar ${state.scoreResult.correct} dari ${state.scoreResult.total} soal)\n\nTerima kasih!`;
            
            const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
            window.open(waUrl, '_blank');
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderTimerOnly() {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                timerEl.innerText = formatTime(state.timeRemaining);
                if (state.timeRemaining < 60) {
                    timerEl.className = "font-mono text-xl font-bold px-4 py-1 rounded-full bg-red-100 text-red-600 animate-pulse";
                }
            }
        }

        function renderPreviewOnly() {
            const previewContainer = document.getElementById('preview-content');
            if (!previewContainer) return;

            const lines = state.text.split('\n').filter(t => t.trim() !== '');
            const labels = ['A', 'B', 'C', 'D'];

            let html = '';

            if (state.type === 'reading') {
                const parts = state.text.split('---');
                const passage = parts[0] ? parts[0].trim() : '';
                const qLines = parts[1] ? parts[1].trim().split('\n').filter(l => l.trim() !== '') : [];

                html += `
                    <div class="p-4 bg-slate-50 border border-slate-300 rounded-xl mb-6 text-sm text-justify leading-relaxed page-break-inside-avoid">
                        ${passage.replace(/\n/g, '<br>')}
                    </div>
                    <h4 class="font-bold text-slate-800 mb-4 border-b pb-2">Soal Pertanyaan:</h4>
                `;

                qLines.forEach((q, idx) => {
                    html += `<div class="mb-4 text-sm flex gap-2 page-break-inside-avoid">
                        <span class="font-bold">${idx + 1}.</span>
                        <div class="flex-1">${q}</div>
                    </div>`;
                });
            } else {
                lines.forEach((line, idx) => {
                    const parts = line.split('|').map(p => p.trim());
                    
                    if (state.type === 'mc' && parts.length >= 5) {
                        html += `
                            <div class="mb-4 text-sm page-break-inside-avoid">
                                <div class="flex gap-2 font-medium mb-1">
                                    <span>${idx + 1}.</span>
                                    <span class="flex-1">${parts[0]}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-y-1.5 ml-5 text-xs text-slate-700">
                                    ${parts.slice(1, 5).map((opt, oIdx) => `
                                        <div class="flex items-center gap-2">
                                            <span class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px] font-bold shrink-0">${labels[oIdx]}</span>
                                            <span>${opt}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else if (state.type === 'matching' && line.includes('-')) {
                        const mParts = line.split('-').map(p => p.trim());
                        html += `
                            <div class="flex justify-between items-center mb-2 text-sm border-b border-dashed border-slate-200 pb-1 page-break-inside-avoid">
                                <span class="w-1/2">${idx + 1}. ${mParts[0] || line}</span>
                                <span class="text-slate-400 font-mono">-------------------------</span>
                                <span class="w-1/3 text-right font-medium">${mParts[1] || '[ Pasangan ]'}</span>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="mb-3 text-sm flex gap-2 page-break-inside-avoid">
                                <span class="font-bold shrink-0">${idx + 1}.</span>
                                <span class="flex-1">${line.split('|')[0]}</span>
                            </div>
                        `;
                    }
                });
            }

            previewContainer.innerHTML = html;
        }

        window.render = function() {
            const app = document.getElementById('app');

            if (state.mode === 'student_start') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-5xl mb-3">📝</div>
                            <h1 class="text-2xl font-bold mb-1 text-slate-800">${state.studentQuiz.subject || 'Ujian Online'}</h1>
                            <p class="text-blue-600 font-medium text-sm mb-4">${state.studentQuiz.topic || 'Lembar Kerja Siswa'}</p>
                            
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-sm mb-4 text-left space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap Siswa:</label>
                                    <input type="text" id="input-student-name" value="${state.studentName}" oninput="window.appState.studentName = this.value" placeholder="Contoh: Budi Santoso" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white outline-none focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Kelas:</label>
                                    <input type="text" id="input-student-class" value="${state.studentClass}" oninput="window.appState.studentClass = this.value" placeholder="Contoh: 8A / 9B" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white outline-none focus:border-blue-500">
                                </div>
                                <div id="exam-error" class="text-xs text-red-600 font-bold"></div>
                            </div>

                            <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs mb-6 text-left space-y-1 text-slate-600">
                                <div>⏱️ <strong>Durasi Waktu:</strong> ${state.studentQuiz.time} Menit</div>
                                <div>📊 <strong>Jumlah Soal:</strong> ${state.studentQuiz.text.split('\n').filter(t=>t.trim()!=='').length} Pertanyaan</div>
                            </div>

                            <button onclick="window.startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-base">
                                Mulai Kerjakan Sekarang
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.mode === 'student_exam') {
                const lines = state.studentQuiz.text.split('\n').filter(t => t.trim() !== '');
                const labels = ['A', 'B', 'C', 'D'];
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 pb-20">
                        <div class="sticky top-0 bg-white shadow-sm border-b border-slate-200 p-4 flex justify-between items-center z-50 max-w-4xl mx-auto px-6">
                            <div>
                                <h1 class="font-bold text-base text-slate-800">${state.studentQuiz.subject} (${state.studentName} - ${state.studentClass})</h1>
                                <p class="text-xs text-slate-500">${state.studentQuiz.topic}</p>
                            </div>
                            <div id="timer-display" class="font-mono text-xl font-bold px-4 py-1 rounded-full bg-slate-100 text-slate-700">
                                ${formatTime(state.timeRemaining)}
                            </div>
                        </div>
                        <div class="max-w-3xl mx-auto p-4 mt-6">
                            ${lines.map((line, idx) => {
                                const parts = line.split('|').map(p => p.trim());
                                const isMC = parts.length >= 5;
                                return `
                                    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
                                        <h3 class="text-base font-medium mb-4"><span class="mr-2 font-bold">${idx + 1}.</span> ${parts[0]}</h3>
                                        ${isMC ? `
                                            <div class="flex flex-col gap-2.5 ml-2">
                                                ${parts.slice(1, 5).map((opt, oIdx) => `
                                                    <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${state.studentAnswers[idx] === labels[oIdx] ? 'border-blue-500 bg-blue-50 font-medium' : 'border-slate-200 hover:bg-slate-50'}">
                                                        <input type="radio" name="q-${idx}" value="${labels[oIdx]}" 
                                                            ${state.studentAnswers[idx] === labels[oIdx] ? 'checked' : ''} 
                                                            onchange="window.appState.studentAnswers[${idx}] = '${labels[oIdx]}'; window.render();" 
                                                            class="w-4 h-4 text-blue-600">
                                                        <span class="text-sm">${labels[oIdx]}. ${opt}</span>
                                                    </label>
                                                `).join('')}
                                            </div>
                                        ` : `
                                            <textarea rows="3" placeholder="Tuliskan jawaban Anda di sini..." 
                                                oninput="window.appState.studentAnswers[${idx}] = this.value"
                                                class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                                        `}
                                    </div>
                                `;
                            }).join('')}
                            <button onclick="window.submitExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg">
                                ✅ Selesai & Kumpulkan Jawaban
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.mode === 'result') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-6xl mb-4">🏆</div>
                            <h1 class="text-3xl font-bold text-slate-800 mb-1">Ujian Selesai!</h1>
                            <p class="text-slate-500 text-sm mb-2">Terima kasih, <strong>${state.studentName}</strong> (${state.studentClass})</p>
                            
                            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6">
                                <div class="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1">Nilai Akhir</div>
                                <div class="text-6xl font-black text-blue-600 mb-2">${state.scoreResult.score}</div>
                                <div class="text-slate-600 text-sm">Benar <strong>${state.scoreResult.correct}</strong> dari <strong>${state.scoreResult.total}</strong> soal</div>
                            </div>

                            ${state.studentQuiz.wa ? `
                                <button onclick="window.sendScoreToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2 mb-3">
                                    <span>📲</span> Kirim Nilai ke WhatsApp Guru
                                </button>
                            ` : ''}
                            
                            <p class="text-xs text-slate-400">Silakan klik tombol di atas agar nilai Anda tercatat di WhatsApp Guru.</p>
                        </div>
                    </div>
                `;
                return;
            }

            app.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    ${state.showModal ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex justify-center items-center p-4 modal-backdrop">
                            <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button onclick="window.appState.showModal = false; window.render();" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                                
                                <h2 class="text-xl font-bold mb-1 text-slate-800">🌐 Link Kuis Online Siswa</h2>
                                <p class="text-slate-500 text-xs mb-4">Salin link di bawah ini dan bagikan ke WhatsApp siswa.</p>

                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Link Kuis Siswa:</label>
                                    <input type="text" readonly value="${state.rawShareUrl}" class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-xs text-blue-600 font-bold font-mono outline-none">
                                </div>

                                <div class="space-y-2">
                                    <button onclick="window.copyLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-md flex justify-center items-center gap-2">
                                        <span>📋</span> Salin Link Kuis
                                    </button>
                                    <div id="copy-feedback" class="text-center text-xs font-bold text-emerald-600 h-4"></div>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-3.5 flex justify-between items-center no-print sticky top-0 z-10">
                        <div class="flex items-center gap-2 text-blue-600 font-black text-xl tracking-tight">
                            <span>✏️</span> EduGenerator Pro <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-semibold">Ready</span>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="window.generateLink()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2 shadow-sm text-sm">
                                <span>🌐</span> Bagikan Online
                            </button>
                            <button onclick="window.triggerPrint()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2 shadow-sm text-sm">
                                <span>🖨️</span> Cetak Kertas (A4)
                            </button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
                        <aside class="w-full lg:w-[410px] bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col gap-4 shrink-0 h-fit no-print">
                            
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📌 Informasi Guru & Materi</h3>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">Nomor WhatsApp Guru (Contoh: 62812...)</label>
                                    <input type="text" value="${state.teacherWhatsApp}" oninput="window.appState.teacherWhatsApp = this.value" 
                                        class="w-full border border-slate-300 rounded-lg p-2 text-sm font-medium outline-none focus:border-blue-500 bg-white" placeholder="628xxxxxxxxxx">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">Mata Pelajaran</label>
                                    <input type="text" value="${state.subject}" oninput="window.appState.subject = this.value; renderPreviewOnly();" 
                                        class="w-full border border-slate-300 rounded-lg p-2 text-sm font-medium outline-none focus:border-blue-500 bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">Judul Materi / Bab</label>
                                    <input type="text" value="${state.topic}" oninput="window.appState.topic = this.value; renderPreviewOnly();" 
                                        class="w-full border border-slate-300 rounded-lg p-2 text-sm font-medium outline-none focus:border-blue-500 bg-white">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">1. Pilih Tipe Soal (25 Jenis)</label>
                                <select onchange="window.setType(this.value)" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-medium bg-slate-50 outline-none focus:border-blue-500">
                                    ${QUESTION_TYPES.map(cat => `
                                        <optgroup label="${cat.category}">
                                            ${cat.items.map(item => `
                                                <option value="${item.id}" ${state.type === item.id ? 'selected' : ''}>${item.label}</option>
                                            `).join('')}
                                        </optgroup>
                                    `).join('')}
                                </select>
                            </div>

                            <button onclick="window.generate25Auto()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition text-sm flex justify-center items-center gap-2 shadow-sm">
                                <span>⚡</span> Generate 25 Soal Otomatis (${state.topic})
                            </button>

                            ${state.type === 'mc' ? `
                                <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl">
                                    <label class="block text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Durasi Kuis Online (Menit)</label>
                                    <input type="number" min="1" value="${state.timeLimit}" onchange="window.appState.timeLimit = this.value" class="w-full border border-emerald-300 rounded-lg p-2 text-center font-bold text-emerald-900 bg-white outline-none">
                                </div>
                            ` : ''}

                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. Edit Isi Soal</label>
                                    <span class="text-[11px] text-blue-600 font-semibold">${state.text.split('\n').filter(t=>t.trim()!=='').length} Soal Terdeteksi</span>
                                </div>
                                <textarea rows="7" oninput="window.updateText(this.value)" class="w-full border border-slate-300 rounded-xl p-3 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-slate-50">${state.text}</textarea>
                            </div>

                            <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-xs text-blue-900 leading-relaxed">
                                💡 <strong>Info:</strong> Klik tombol kuning di atas untuk meracik 25 soal baru secara instan sesuai Mapel & Topik Anda!
                            </div>
                        </aside>

                        <!-- AREA KERTAS A4 -->
                        <section class="flex-1 bg-slate-200 rounded-2xl p-4 md:p-8 flex justify-center items-start overflow-auto">
                            <div class="bg-white shadow-2xl a4-paper p-10 md:p-14 text-slate-900 print-area flex flex-col justify-between">
                                <div>
                                    <!-- KOP KERTAS -->
                                    <div class="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                                        <div>
                                            <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">${state.subject || 'MATA PELAJARAN'}</span>
                                            <h2 class="text-xl font-bold uppercase tracking-wider text-slate-900 mt-0.5">${state.topic || 'LEMBAR KERJA SISWA'}</h2>
                                            <p class="text-slate-500 text-xs mt-1">${state.instructions}</p>
                                        </div>
                                        <div class="w-56 text-xs space-y-1.5 text-slate-700">
                                            <div class="flex border-b border-slate-400 pb-0.5"><span class="w-16 font-semibold">Nama</span>:</div>
                                            <div class="flex border-b border-slate-400 pb-1"><span class="w-16 font-semibold">Kelas</span>:</div>
                                            <div class="flex border-b border-slate-400 pb-1"><span class="w-16 font-semibold">Nilai</span>:</div>
                                        </div>
                                    </div>

                                    <!-- KONTEN PREVIEW SOAL -->
                                    <div id="preview-content"></div>
                                </div>

                                <div class="mt-8 pt-3 border-t border-slate-200 flex justify-between text-[11px] text-slate-400">
                                    <span>EduGenerator Pro — ${state.subject}</span>
                                    <span>Halaman Kertas Soal</span>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            `;

            renderPreviewOnly();
        }

        window.onload = init;
    </script>
</body>
</html>
