<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenerator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .a4-paper { width: 210mm; min-height: 297mm; }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body, #app, main, section { background: white !important; color: black !important; width: 100% !important; height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; display: block !important; box-shadow: none !important; }
            .no-print, header, aside, .modal-backdrop, button { display: none !important; }
            .print-area { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; border: none !important; display: block !important; }
            .page-break-inside-avoid { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Di sinilah aplikasi akan muncul -->
    <div id="app"></div>

    <script>
        // Sistem Anti Layar Putih (Error Handler)
        window.onerror = function(msg, url, lineNo) {
            document.getElementById('app').innerHTML = `
                <div class="p-10 text-center">
                    <div class="text-6xl mb-4">⚠️</div>
                    <h1 class="text-2xl font-bold text-red-600 mb-2">Terjadi Kesalahan Sistem</h1>
                    <p class="text-slate-600 bg-red-50 p-4 rounded-xl font-mono text-sm inline-block">Error: ${msg} (Baris:${lineNo})</p>
                    <p class="mt-4 text-sm">Kemungkinan ada kode yang terpotong saat Copy-Paste. Silakan ulangi proses salin kodenya secara utuh.</p>
                </div>`;
            return false;
        };

        // --- PENGATURAN DATA AWAL ---
        let savedKey = ''; 
        try { savedKey = localStorage.getItem('gemini_api_key') || ''; } catch(e) {}

        window.state = {
            mode: 'teacher', 
            type: 'mc', 
            subject: 'Bahasa Indonesia', 
            topic: 'Pemahaman Teks',
            text: 'Teks soal akan muncul di sini...\n\nSilakan klik tombol Kuning atau Ungu di sebelah kiri.',
            timeLimit: 15, 
            teacherWhatsApp: '628123456789', 
            apiKey: savedKey, 
            rawShareUrl: '', 
            showModal: false, 
            showApiModal: false, 
            studentQuiz: null, 
            studentName: '', 
            studentClass: '', 
            studentAnswers: {}, 
            timeRemaining: 0, 
            timerInterval: null, 
            scoreResult: null
        };

        // --- FUNGSI TOMBOL KUNING (TANPA AI) ---
        function generateOffline() {
            let lines = [];
            for (let i = 1; i <= 25; i++) {
                if (window.state.type === 'mc') { 
                    lines.push(`Pertanyaan ${i} mengenai materi ${window.state.topic} pada pelajaran${window.state.subject}? | Pilihan A | Pilihan B | Pilihan C | Pilihan D | A`); 
                } else if (window.state.type === 'tf') { 
                    lines.push(`Pernyataan ${i} terkait materi${window.state.topic} bernilai benar atau salah.`); 
                } else { 
                    lines.push(`Jelaskan secara singkat mengenai poin ke-${i} dari materi${window.state.topic}?`); 
                }
            }
            window.state.text = lines.join('\n');
            renderApp();
        }

        // --- FUNGSI TOMBOL UNGU (DENGAN AI) ---
        async function generateWithAI() {
            if (!window.state.apiKey || window.state.apiKey.trim() === '') {
                window.state.showApiModal = true; 
                renderApp(); 
                return;
            }
            
            window.state.text = "⏳ Menghubungkan ke Gemini AI...\nMohon tunggu 5-10 detik..."; 
            renderApp();
            
            const prompt = `Buatkan 25 soal ujian untuk pelajaran "${window.state.subject}" materi "${window.state.topic}". Tipe soal: ${window.state.type}. Jika tipe 'mc', format WAJIB per baris: Pertanyaan | Pilihan A | Pilihan B | Pilihan C | Pilihan D | Kunci(A/B/C/D). Tanpa nomor urut di awal baris. Hanya berikan teks soal.`;
            const models = ['gemini-1.5-flash', 'gemini-1.0-pro', 'gemini-pro'];
            let success = false; 
            let errorMsg = "";

            for (const model of models) {
                if (success) break;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${window.state.apiKey}`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        window.state.text = data.candidates[0].content.parts[0].text.replace(/```/g, '').trim();
                        success = true;
                    } else {
                        const err = await res.json(); 
                        errorMsg = err.error?.message || "Model error";
                    }
                } catch (e) { 
                    errorMsg = e.message; 
                }
            }
            
            if (!success) {
                window.state.text = "❌ AI GAGAL TERHUBUNG.\nPenyebab: " + errorMsg + "\n\nSilakan gunakan tombol Kuning (Generate Tanpa AI) untuk sementara.";
                alert("Gagal memuat AI. Silakan gunakan tombol Kuning.");
            }
            renderApp();
        }

        // --- FUNGSI PENDUKUNG ---
        function saveApi() {
            const inputKey = document.getElementById('modal-api-key').value.trim();
            if (!inputKey) { alert("API Key kosong!"); return; }
            window.state.apiKey = inputKey;
            try { localStorage.setItem('gemini_api_key', inputKey); } catch(e){}
            window.state.showApiModal = false; 
            generateWithAI();
        }

        function setType(val) { window.state.type = val; renderApp(); }
        function updateText(val) { window.state.text = val; renderPreviewOnly(); }
        function triggerPrint() { window.print(); }

        // --- FUNGSI LINK DAN UJIAN ---
        async function generateLink() {
            const payload = { 
                t: window.state.type, 
                s: window.state.subject, 
                tp: window.state.topic, 
                tm: Number(window.state.timeLimit) || 15, 
                w: window.state.teacherWhatsApp.replace(/[^0-9]/g, ''), 
                x: window.state.text 
            };
            const jsonStr = JSON.stringify(payload); 
            let encodedStr = '';
            try {
                const stream = new Blob([jsonStr]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                const buffer = await new Response(stream).arrayBuffer();
                encodedStr = 'C' + btoa(String.fromCharCode.apply(null, new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                const utf8Bytes = new TextEncoder().encode(jsonStr);
                encodedStr = 'U' + btoa(String.fromCharCode.apply(null, utf8Bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            window.state.rawShareUrl = `${window.location.origin}${window.location.pathname}?q=${encodedStr}`; 
            window.state.showModal = true; 
            renderApp();
        }

        function copyLink() {
            const i = document.createElement('textarea'); 
            i.value = window.state.rawShareUrl; 
            document.body.appendChild(i); 
            i.select();
            try { 
                document.execCommand('copy'); 
                document.getElementById('copy-feedback').innerText = '✅ Tersalin!'; 
            } catch (err) {} 
            document.body.removeChild(i);
        }

        function renderPreviewOnly() {
            const container = document.getElementById('preview-content'); 
            if (!container) return;
            const labels = ['A', 'B', 'C', 'D']; 
            let html = '';
            
            const lines = window.state.text.split('\n').filter(t => t.trim() !== '');
            for (let idx = 0; idx < lines.length; idx++) {
                const parts = lines[idx].split('|').map(x => x.trim());
                if (window.state.type === 'mc' && parts.length >= 5) {
                    html += `
                    <div class="mb-4 text-sm page-break-inside-avoid">
                        <div class="flex gap-2 font-medium mb-1">
                            <span>${idx+1}.</span><span class="flex-1">${parts[0]}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-y-1.5 ml-5 text-xs">
                            <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-
            rawShareUrl: '', 
            showModal: false, 
            showApiModal: false, 
            studentQuiz: null, 
            studentName: '', 
            studentClass: '', 
            studentAnswers: {}, 
            timeRemaining: 0, 
            timerInterval: null, 
            scoreResult: null
        };

        // --- 2. FUNGSI TOMBOL KUNING (TANPA AI) ---
        function generateOffline() {
            let lines = [];
            for (let i = 1; i <= 25; i++) {
                if (window.state.type === 'mc') { 
                    lines.push(`Pertanyaan ${i} mengenai konsep dasar ${window.state.topic} pada pelajaran ${window.state.subject}? | Pilihan A | Pilihan B | Pilihan C | Pilihan D | A`); 
                } else if (window.state.type === 'tf') { 
                    lines.push(`Pernyataan ${i} terkait materi ${window.state.topic} bernilai benar atau salah.`); 
                } else { 
                    lines.push(`Jelaskan secara singkat mengenai poin ke-${i} dari materi ${window.state.topic}?`); 
                }
            }
            window.state.text = lines.join('\n');
            renderApp();
        }

        // --- 3. FUNGSI TOMBOL UNGU (DENGAN AI) ---
        async function generateWithAI() {
            if (!window.state.apiKey || window.state.apiKey.trim() === '') {
                window.state.showApiModal = true; 
                renderApp(); 
                return;
            }
            
            window.state.text = "⏳ Menghubungkan ke Gemini AI...\nMohon tunggu 5-10 detik..."; 
            renderApp();
            
            const prompt = `Buatkan 25 soal ujian untuk pelajaran "${window.state.subject}" materi "${window.state.topic}". Tipe soal: ${window.state.type}. Jika tipe 'mc', format WAJIB: Pertanyaan | Opsi A | Opsi B | Opsi C | Opsi D | Kunci(A/B/C/D). Tanpa nomor urut di awal baris. Hanya berikan teks soal.`;
            const models = ['gemini-1.5-flash', 'gemini-1.0-pro', 'gemini-pro'];
            let success = false; 
            let errorMsg = "";

            for (const model of models) {
                if (success) break;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${window.state.apiKey}`, {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        window.state.text = data.candidates[0].content.parts[0].text.replace(/```/g, '').trim();
                        success = true;
                    } else {
                        const err = await res.json(); 
                        errorMsg = err.error?.message || "Model error";
                    }
                } catch (e) { 
                    errorMsg = e.message; 
                }
            }
            
            if (!success) {
                window.state.text = "❌ AI GAGAL TERHUBUNG.\nPenyebab: " + errorMsg + "\n\nSaran: \n1. Cek kembali API Key Anda.\n2. Klik tombol kuning 'Generate Tanpa AI' di kiri agar Anda tetap bisa lanjut membuat soal sekarang juga!";
                alert("Gagal memuat AI. Silakan gunakan tombol Kuning (Generate Tanpa AI).");
            }
            renderApp();
        }

        // --- 4. FUNGSI PENDUKUNG ---
        function saveApi() {
            const inputKey = document.getElementById('modal-api-key').value.trim();
            if (!inputKey) { alert("API Key kosong!"); return; }
            window.state.apiKey = inputKey;
            try { localStorage.setItem('gemini_api_key', inputKey); } catch(e){}
            window.state.showApiModal = false; 
            generateWithAI();
        }

        function setType(val) { window.state.type = val; renderApp(); }
        function updateText(val) { window.state.text = val; renderPreviewOnly(); }
        function triggerPrint() { window.print(); }

        // --- 5. FUNGSI LINK DAN UJIAN SISWA ---
        async function generateLink() {
            const payload = { t: window.state.type, s: window.state.subject, tp: window.state.topic, tm: Number(window.state.timeLimit) || 15, w: window.state.teacherWhatsApp.replace(/[^0-9]/g, ''), x: window.state.text };
            const jsonStr = JSON.stringify(payload); 
            let encodedStr = '';
            try {
                const buffer = await new Response(new Blob([jsonStr]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
                encodedStr = 'C' + btoa(String.fromCharCode.apply(null, new Uint8Array(buffer))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                encodedStr = 'U' + btoa(String.fromCharCode.apply(null, new TextEncoder().encode(jsonStr))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            window.state.rawShareUrl = `${window.location.origin}${window.location.pathname}?q=${encodedStr}`; 
            window.state.showModal = true; 
            renderApp();
        }

        function copyLink() {
            const i = document.createElement('textarea'); i.value = window.state.rawShareUrl; document.body.appendChild(i); i.select();
            try { document.execCommand('copy'); document.getElementById('copy-feedback').innerText = '✅ Tersalin!'; } catch (err) {} 
            document.body.removeChild(i);
        }

        function startExam() {
            if (!window.state.studentName.trim() || !window.state.studentClass.trim()) { document.getElementById('exam-error').innerText = "Isi Nama dan Kelas!"; return; }
            window.state.mode = 'student_exam'; renderApp();
            window.state.timerInterval = setInterval(() => {
                window.state.timeRemaining--;
                if (window.state.timeRemaining <= 0) { 
                    clearInterval(window.state.timerInterval); submitExam(); 
                } else { 
                    const el = document.getElementById('timer-display'); 
                    if (el) el.innerText = `${Math.floor(window.state.timeRemaining/60)}:${(window.state.timeRemaining%60).toString().padStart(2,'0')}`; 
                }
            }, 1000);
        }

        function submitExam() {
            if (window.state.timerInterval) clearInterval(window.state.timerInterval);
            let correct = 0, total = 0;
            window.state.studentQuiz.text.split('\n').filter(l => l.trim() !== '').forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) { total++; if (window.state.studentAnswers[idx] === parts[5].toUpperCase()) correct++; }
            });
            total = total > 0 ? total : 1; 
            window.state.scoreResult = { correct, total, score: Math.round((correct / total) * 100) }; 
            window.state.mode = 'result'; 
            renderApp();
        }

        function sendWA() {
            const msg = `Halo Guru, saya telah menyelesaikan kuis:\n👤 Nama: ${window.state.studentName}\n🏫 Kelas: ${window.state.studentClass}\n📚 Mapel: ${window.state.studentQuiz.subject}\n🏆 Nilai: *${window.state.scoreResult.score}*`;
            window.open(`[https://wa.me/$](https://wa.me/$){window.state.studentQuiz.wa}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- 6. RENDER TAMPILAN ---
        function renderPreviewOnly() {
            const c = document.getElementById('preview-content'); if (!c) return;
            const labels = ['A', 'B', 'C', 'D']; let html = '';
            window.state.text.split('\n').filter(t => t.trim() !== '').forEach((line, idx) => {
                const p = line.split('|').map(x => x.trim());
                if (window.state.type === 'mc' && p.length >= 5) {
                    html += `<div class="mb-4 text-sm page-break-inside-avoid"><div class="flex gap-2 font-medium mb-1"><span>${idx+1}.</span><span class="flex-1">${p[0]}</span></div><div class="grid grid-cols-2 gap-y-1.5 ml-5 text-xs">${p.slice(1,5).map((opt, oIdx) => `<div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px] font-bold">${labels[oIdx]}</span><span>${opt}</span></div>`).join('')}</div></div>`;
                } else { html += `<div class="mb-3 text-sm flex gap-2 page-break-inside-avoid"><span class="font-bold">${idx+1}.</span><span class="flex-1">${p[0]}</span></div>`; }
            });
            c.innerHTML = html;
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            if (window.state.mode === 'student_start') {
                app.innerHTML = `<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center"><div class="text-5xl mb-3">📝</div><h1 class="text-2xl font-bold mb-1">${window.state.studentQuiz.subject}</h1><p class="text-blue-600 font-medium mb-4">${window.state.studentQuiz.topic}</p><div class="bg-slate-50 border p-4 rounded-xl text-sm mb-4 text-left space-y-3"><div><label class="block font-bold mb-1">Nama Lengkap:</label><input type="text" value="${window.state.studentName}" oninput="window.state.studentName = this.value" class="w-full border rounded-lg p-2.5"></div><div><label class="block font-bold mb-1">Kelas:</label><input type="text" value="${window.state.studentClass}" oninput="window.state.studentClass = this.value" class="w-full border rounded-lg p-2.5"></div><div id="exam-error" class="text-xs text-red-600 font-bold"></div></div><button onclick="startExam()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl">Mulai Ujian</button></div></div>`; return;
            }
            if (window.state.mode === 'student_exam') {
                const labels = ['A', 'B', 'C', 'D'];
                app.innerHTML = `<div class="min-h-screen bg-slate-50 pb-20"><div class="sticky top-0 bg-white shadow-sm border-b p-4 flex justify-between z-50"><h1 class="font-bold">${window.state.studentQuiz.subject}</h1><div id="timer-display" class="font-mono font-bold bg-slate-100 px-4 py-1 rounded-full">0:00</div></div><div class="max-w-3xl mx-auto p-4 mt-6">${window.state.studentQuiz.text.split('\n').filter(t => t.trim() !== '').map((line, idx) => { const p = line.split('|').map(x => x.trim()); const isMC = p.length >= 5; return `<div class="bg-white p-6 rounded-xl shadow-sm mb-6 border"><h3 class="font-medium mb-4"><span class="mr-2 font-bold">${idx+1}.</span> ${p[0]}</h3>${isMC ? `<div class="flex flex-col gap-2.5 ml-2">${p.slice(1,5).map((opt, oIdx) => `<label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer"><input type="radio" name="q-${idx}" value="${labels[oIdx]}" onchange="window.state.studentAnswers[${idx}] = '${labels[oIdx]}'; renderApp();"><span class="text-sm">${labels[oIdx]}. ${opt}</span></label>`).join('')}</div>` : `<textarea rows="3" oninput="window.state.studentAnswers[${idx}] = this.value" class="w-full border rounded-xl p-3"></textarea>`}</div>`; }).join('')}<button onclick="submitExam()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold">Selesai & Kumpulkan</button></div></div>`; return;
            }
            if (window.state.mode === 'result') {
                app.innerHTML = `<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4"><div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center"><div class="text-6xl mb-4">🏆</div><h1 class="text-3xl font-bold mb-1">Selesai!</h1><div class="bg-slate-50 border rounded-2xl p-6 mb-6"><div class="text-6xl font-black text-blue-600 mb-2">${window.state.scoreResult.score}</div><div>Benar ${window.state.scoreResult.correct} dari ${window.state.scoreResult.total}</div></div><button onclick="sendWA()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl">Kirim Nilai ke Guru</button></div></div>`; return;
            }

            // TAMPILAN GURU
            app.innerHTML = `
                <div class="min-h-screen flex flex-col relative">
                    ${window.state.showApiModal ? `<div class="fixed inset-0 bg-slate-900/80 z-[60] flex justify-center items-center p-4"><div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative text-center border-4 border-purple-500"><button onclick="window.state.showApiModal=false; renderApp();" class="absolute top-4 right-5 text-slate-400 font-bold text-xl">✕</button><div class="text-6xl mb-4">🤖</div><h2 class="text-2xl font-black mb-2">API Key Gemini</h2><div class="text-left mb-6"><input type="password" id="modal-api-key" placeholder="Paste API Key di sini..." class="w-full border-2 border-purple-300 rounded-xl p-3.5 outline-none" value="${window.state.apiKey}"></div><button onclick="saveApi();" class="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl">Simpan & Buat</button></div></div>` : ''}
                    ${window.state.showModal ? `<div class="fixed inset-0 bg-black/50 z-50 flex justify-center items-center p-4"><div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative"><button onclick="window.state.showModal=false; renderApp();" class="absolute top-4 right-4 text-slate-400 font-bold">✕</button><h2 class="text-xl font-bold mb-1">Link Kuis</h2><input type="text" readonly value="${window.state.rawShareUrl}" class="w-full bg-slate-100 border rounded-xl p-3 text-xs font-mono mb-4"><button onclick="copyLink()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl w-full">Salin Link</button><div id="copy-feedback" class="text-center text-xs font-bold text-emerald-600 mt-2"></div></div></div>` : ''}

                    <header class="bg-white shadow-sm border-b px-6 py-3.5 flex justify-between items-center no-print">
                        <div class="font-black text-xl text-blue-600">✏️ EduGenerator Pro</div>
                        <div class="flex gap-3"><button onclick="generateLink()" class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium">Bagikan Online</button><button onclick="triggerPrint()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium">Cetak Kertas</button></div>
                    </header>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
                        <aside class="w-full lg:w-[410px] bg-white rounded-2xl border p-5 flex flex-col gap-4 h-fit no-print">
                            <div class="bg-slate-50 p-4 rounded-xl border space-y-3">
                                <div><label class="block text-xs font-medium mb-1">No. WA Guru</label><input type="text" value="${window.state.teacherWhatsApp}" oninput="window.state.teacherWhatsApp = this.value" class="w-full border rounded-lg p-2 text-sm"></div>
                                <div><label class="block text-xs font-medium mb-1">Mapel</label><input type="text" value="${window.state.subject}" oninput="window.state.subject=this.value; renderPreviewOnly();" class="w-full border rounded-lg p-2 text-sm"></div>
                                <div><label class="block text-xs font-medium mb-1">Materi</label><input type="text" value="${window.state.topic}" oninput="window.state.topic=this.value; renderPreviewOnly();" class="w-full border rounded-lg p-2 text-sm"></div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold mb-1.5">Pilih Tipe</label>
                                <select onchange="setType(this.value)" class="w-full border rounded-xl p-2.5 text-sm">
                                    <option value="mc" ${window.state.type === 'mc' ? 'selected' : ''}>1. Pilihan Ganda (A/B/C/D)</option>
                                    <option value="tf" ${window.state.type === 'tf' ? 'selected' : ''}>2. Benar atau Salah (True / False)</option>
                                    <option value="essay" ${window.state.type === 'essay' ? 'selected' : ''}>3. Uraian / Essay</option>
                                </select>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <button onclick="generateWithAI()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl text-xs flex flex-col items-center justify-center gap-1 shadow-sm">

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="app"></div>

    <script>
        // --- 25 TIPE SOAL LENGKAP & PRESET DEFAULT ---
        const QUESTION_TYPES = [
            {

            {
                category: "Percakapan & Teks",
                items: [
                    { id: 'dialogue_comp', label: '12. Melengkapi Percakapan (Dialogue)', hint: 'A: Halo!\nB: ________' },

                    { id: 'transform', label: '16. Transformasi Kalimat', hint: 'Kalimat dasar (Instruksi perubahan)' },
                    { id: 'word_form', label: '17. Pembentukan Kata (Word Form)', hint: 'Kalimat ________ (kata dasar)' },
                    { id: 'syn_ant', label: '18. Sinonim & Antonim', hint: 'Kata Utama - [Sinonim / Antonim]' },
                    { id: 'vocab', label: '19. Kosakata & Definisi', hint: 'Kosakata : Definisi singkat' },
                    { id: 'word_search', label: '20. Acak Kata / Anagram', hint: 'KATAACAK (Kata Asli)' },

            {
                category: "Media & Soal Spesial",
                items: [
                    { id: 'picture', label: '21. Soal Berbasis Gambar', hint: 'Pertanyaan pengamatan gambar' },
                    { id: 'listening', label: '22. Soal Menyimak (Listening)', hint: 'Pertanyaan berdasarkan audio track' },
                    { id: 'speaking', label: '23. Instruksi Bicara (Speaking Test)', hint: 'Topik / Tugas bicara siswa' },
                    { id: 'info_gap', label: '24. Melengkapi Tabel Informasi', hint: 'Data1 - Data2 - Data3 (Gunakan ____)' },
                    { id: 'math_logic', label: '25. Soal Cerita Matematika / Logika', hint: 'Soal hitungan atau penalaran matematika' },
                ]
            }
        ];

        // --- AUTOMATED GENERATOR 25 SOAL ---
        function generate25QuestionsText(type, subject, topic) {
            let lines = [];
            for (let i = 1; i <= 25; i++) {
                switch(type) {
                    case 'mc':
                        lines.push(`Soal Pilihan Ganda no ${i} (${topic})? | Opsi A | Opsi B | Opsi C | Opsi D | A`);
                        break;
                    case 'tf':
                        lines.push(`Pernyataan no ${i} mengenai ${topic} adalah benar.`);
                        break;
                    case 'tf_correct':
                        lines.push(`Pernyataan no ${i} salah pada konsep ${topic}. (Tulis perbaikannya)`);
                        break;
                    case 'odd_out':
                        lines.push(`Item_${i}A, Item_${i}B, Item_${i}C, BEDA_${i}`);
                        break;
                    case 'fill':
                        lines.push(`Pada materi ${topic}, poin no ${i} adalah ________.`);
                        break;
                    case 'cloze':
                        lines.push(`Bagian (${i}) materi ${topic} menjelaskan ________ adalah kunci utama.`);
                        break;
                    case 'short_answer':
                        lines.push(`Jelaskan poin ke-${i} dari topik ${topic}?`);
                        break;
                    case 'essay':
                        lines.push(`Berikan analisis mendalam poin no ${i} tentang ${topic}!`);
                        break;
                    case 'matching':
                        lines.push(`Istilah ${topic} #${i} - Pasangan #${i}`);
                        break;
                    case 'sequencing':
                        lines.push(`Langkah ke-${i} proses ${topic}.`);
                        break;
                    case 'rearrange':
                        lines.push(`ini - susunan - kata - acak - ${i}`);
                        break;
                    case 'dialogue_comp':
                        lines.push(`Siswa A: Apa pendapatmu tentang ${topic} poin ${i}?\nSiswa B: Menurut saya ________.`);
                        break;
                    case 'dialogue_order':
                        lines.push(`Dialog acak no ${i} diskusi ${topic}.`);
                        break;
                    case 'reading':
                        if (i === 1) {
                            lines.push(`TEKS BACAAN: ${topic.toUpperCase()}\nIni adalah teks bacaan untuk menjawab 25 soal di bawah.\n---`);
                        }
                        lines.push(`Berdasarkan teks, apa maksud poin ke-${i}?`);
                        break;
                    case 'error_id':
                        lines.push(`Kalimat no ${i} [memiliki] kesalahan grammar ${topic}.`);
                        break;
                    case 'transform':
                        lines.push(`Ubah kalimat no ${i} (${topic}) ke bentuk pasif/negatif!`);
                        break;
                    case 'word_form':
                        lines.push(`Siswa harus ________ (TERAP) ilmu ${topic} pada soal ${i}.`);
                        break;
                    case 'syn_ant':
                        lines.push(`Kata_${i} - [Sinonim & Antonim]`);
                        break;
                    case 'vocab':
                        lines.push(`Istilah_${i} : Penjelasan kata kunci ${i}.`);
                        break;
                    case 'word_search':
                        lines.push(`KATA${i} (Cari kata KATA${i})`);
                        break;
                    case 'picture':
                        lines.push(`Amati gambar ${i}, jelaskan proses ${topic}!`);
                        break;
                    case 'listening':
                        lines.push(`Track ${i}: Apa informasi utama tentang ${topic}?`);
                        break;
                    case 'speaking':
                        lines.push(`Topik ${i}: Ceritakan pengalaman terkait ${topic}!`);
                        break;
                    case 'info_gap':
                        lines.push(`Item #${i} - Data A: ____ - Data B: Lengkap`);
                        break;
                    case 'math_logic':
                        lines.push(`Sebuah benda ada ${i} unit. Berapa total jika ditambah ${i * 2} unit?`);
                        break;
                    default:
                        lines.push(`Pertanyaan no ${i} untuk ${topic}.`);
                }
            }
            return lines.join('\n');
        }

        // --- STATE APLIKASI ---
        let state = {
            mode: 'teacher',
            type: 'mc',
            subject: 'Bahasa Inggris / Umum',
            topic: 'Simple Present Tense & Daily Routine',
            instructions: 'Jawablah pertanyaan-pertanyaan di bawah ini dengan teliti dan benar!',
            text: '',
            timeLimit: 15,
            rawShareUrl: '',
            shortShareUrl: '',
            isShortening: false,
            compressedRatio: 0,
            showModal: false,
            studentQuiz: null,
            studentAnswers: {},
            timeRemaining: 0,
            timerInterval: null,
            scoreResult: null
        };

        function init() {
            state.text = generate25QuestionsText(state.type, state.subject, state.topic);

            const params = new URLSearchParams(window.location.search);
            const zData = params.get('z'); // Compressed URL payload
            const qData = params.get('q'); // Base64 payload
            
            let decodedObj = null;

            if (zData) {
                try {
                    const decompressed = LZString.decompressFromEncodedURIComponent(zData);
                    if (decompressed) {
                        const raw = JSON.parse(decompressed);
                        decodedObj = {
                            type: raw.t,
                            subject: raw.s,
                            topic: raw.tp,
                            text: raw.tx,
                            time: raw.tm
                        };
                    }
                } catch (e) {
                    console.error("Gagal dekompresi zData", e);
                }
            } else if (qData) {
                try {
                    decodedObj = JSON.parse(decodeURIComponent(atob(qData)));
                } catch (e) {
                    console.error("Gagal dekode qData", e);
                }
            }

            if (decodedObj) {
                state.studentQuiz = decodedObj;
                state.timeRemaining = (decodedObj.time || 15) * 60;
                state.mode = 'student_start';
            }
            
            render();
        }

        function setType(type) {
            state.type = type;
            state.text = generate25QuestionsText(type, state.subject, state.topic);
            render();
        }

        function generate25Auto() {
            state.text = generate25QuestionsText(state.type, state.subject, state.topic);
            render();
        }

        function updateText(text) {
            state.text = text;
            renderPreviewOnly();
        }

        // --- PEMOTONG LINK HANDAL (JSONP IS.GD & V.GD API) ---
        function shortenUrlWithJSONP(longUrl) {
            return new Promise((resolve, reject) => {
                const callbackName = 'isgd_cb_' + Math.floor(Math.random() * 1000000);
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    const scriptEl = document.getElementById(callbackName);
                    if (scriptEl) scriptEl.remove();
                    
                    if (data && data.shorturl) {
                        resolve(data.shorturl);
                    } else {
                        reject(data.errormessage || 'Gagal memotong link');
                    }
                };

                const script = document.createElement('script');
                script.id = callbackName;
                script.src = `https://is.gd/create.php?format=jsonp&callback=${callbackName}&url=${encodeURIComponent(longUrl)}`;
                script.onerror = () => {
                    delete window[callbackName];
                    script.remove();
                    reject('Jaringan offline / terhalang');
                };
                document.body.appendChild(script);
            });
        }

        // --- FUNGSI GENERATE & SHORTEN LINK ---
        async function generateLink() {
            const compactData = { 
                t: state.type, 
                s: state.subject,
                tp: state.topic,
                tx: state.text, 
                tm: state.timeLimit 
            };
            
            const rawJsonStr = JSON.stringify(compactData);
            const compressedStr = LZString.compressToEncodedURIComponent(rawJsonStr);
            
            const compressedUrl = `${window.location.origin}${window.location.pathname}?z=${compressedStr}`;
            
            const originalLength = rawJsonStr.length;
            const compressedLength = compressedStr.length;
            const ratio = Math.round((1 - (compressedLength / (originalLength * 1.5))) * 100);
            
            state.compressedRatio = ratio > 0 ? ratio : 65;
            state.rawShareUrl = compressedUrl;
            state.shortShareUrl = ''; 
            state.showModal = true;
            state.isShortening = true;
            render();

            try {
                const shortUrl = await shortenUrlWithJSONP(compressedUrl);
                state.shortShareUrl = shortUrl;
            } catch (err) {
                console.log("JSONP shortener fallback to LZ string:", err);
                state.shortShareUrl = compressedUrl;
            } finally {
                state.isShortening = false;
                render();
            }
        }

        function copyLink() {
            const linkToCopy = state.shortShareUrl || state.rawShareUrl;
            navigator.clipboard.writeText(linkToCopy);
            alert('Link kuis pendek berhasil disalin! Silakan bagikan ke grup WhatsApp siswa.');
        }

        function startExam() {
            state.mode = 'student_exam';
            render();
            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                if (state.timeRemaining <= 0) {
                    clearInterval(state.timerInterval);
                    submitExam();
                } else {
                    renderTimerOnly();
                }
            }, 1000);
        }

        function submitExam() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const lines = state.studentQuiz.text.split('\n').filter(l => l.trim() !== '' && !l.startsWith('---'));
            let correct = 0;
            let totalEvaluated = 0;

            lines.forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                    totalEvaluated++;
                    const key = parts[5] ? parts[5].toUpperCase() : '';
                    if (state.studentAnswers[idx] === key) correct++;
                }
            });

            const total = totalEvaluated > 0 ? totalEvaluated : lines.length;
            const score = total > 0 ? Math.round((correct / total) * 100) : 100;
            state.scoreResult = { correct, total, score };
            state.mode = 'result';
            render();
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderTimerOnly() {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                timerEl.innerText = formatTime(state.timeRemaining);
                if (state.timeRemaining < 60) {
                    timerEl.className = "font-mono text-xl font-bold px-4 py-1 rounded-full bg-red-100 text-red-600 animate-pulse";
                }
            }
        }

        function renderPreviewOnly() {
            const previewContainer = document.getElementById('preview-content');
            if (!previewContainer) return;

            const lines = state.text.split('\n').filter(t => t.trim() !== '');
            const labels = ['A', 'B', 'C', 'D'];

            let html = '';

            if (state.type === 'reading') {
                const parts = state.text.split('---');
                const passage = parts[0] ? parts[0].trim() : '';
                const qLines = parts[1] ? parts[1].trim().split('\n').filter(l => l.trim() !== '') : [];

                html += `
                    <div class="p-4 bg-slate-50 border border-slate-300 rounded-xl mb-6 text-sm text-justify leading-relaxed page-break-inside-avoid">
                        ${passage.replace(/\n/g, '<br>')}
                    </div>
                    <h4 class="font-bold text-slate-800 mb-4 border-b pb-2">Soal Pertanyaan:</h4>
                `;

                qLines.forEach((q, idx) => {
                    html += `<div class="mb-4 text-sm flex gap-2 page-break-inside-avoid">
                        <span class="font-bold">${idx + 1}.</span>
                        <div class="flex-1">${q}</div>
                    </div>`;
                });
            } else {
                lines.forEach((line, idx) => {
                    const parts = line.split('|').map(p => p.trim());
                    
                    if (state.type === 'mc') {
                        html += `
                            <div class="mb-4 text-sm page-break-inside-avoid">
                                <div class="flex gap-2 font-medium mb-1">
                                    <span>${idx + 1}.</span>
                                    <span class="flex-1">${parts[0]}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-y-1.5 ml-5 text-xs text-slate-700">
                                    ${parts.slice(1, 5).map((opt, oIdx) => `
                                        <div class="flex items-center gap-2">
                                            <span class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px] font-bold shrink-0">${labels[oIdx]}</span>
                                            <span>${opt}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    } else if (state.type === 'matching') {
                        const mParts = line.split('-').map(p => p.trim());
                        html += `
                            <div class="flex justify-between items-center mb-2 text-sm border-b border-dashed border-slate-200 pb-1 page-break-inside-avoid">
                                <span class="w-1/2">${idx + 1}. ${mParts[0] || line}</span>
                                <span class="text-slate-400 font-mono">-------------------------</span>
                                <span class="w-1/3 text-right font-medium">${mParts[1] || '[ Pasangan ]'}</span>
                            </div>
                        `;
                    } else if (state.type === 'picture') {
                        html += `
                            <div class="mb-5 text-sm page-break-inside-avoid">
                                <div class="w-full h-28 bg-slate-100 border border-dashed border-slate-300 rounded-lg flex items-center justify-center text-slate-400 text-xs mb-2">
                                    📷 [ Ilustrasi Gambar Soal No. ${idx + 1} ]
                                </div>
                                <p><strong>${idx + 1}.</strong> ${line}</p>
                            </div>
                        `;
                    } else if (state.type === 'listening') {
                        html += `
                            <div class="mb-3 text-sm flex items-start gap-2 page-break-inside-avoid">
                                <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold shrink-0">🎧 Track ${idx + 1}</span>
                                <span>${line}</span>
                            </div>
                        `;
                    } else if (state.type === 'essay') {
                        html += `
                            <div class="mb-6 text-sm page-break-inside-avoid">
                                <p class="font-medium mb-2">${idx + 1}. ${line}</p>
                                <div class="w-full h-16 border-b border-dashed border-slate-300"></div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="mb-3 text-sm flex gap-2 page-break-inside-avoid">
                                <span class="font-bold shrink-0">${idx + 1}.</span>
                                <span class="flex-1">${line}</span>
                            </div>
                        `;
                    }
                });
            }

            previewContainer.innerHTML = html;
        }

        function render() {
            const app = document.getElementById('app');

            // --- SISWA: MULAI UJIAN ---
            if (state.mode === 'student_start') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-5xl mb-3">📝</div>
                            <h1 class="text-2xl font-bold mb-1 text-slate-800">${state.studentQuiz.subject || 'Ujian Online'}</h1>
                            <p class="text-blue-600 font-medium text-sm mb-4">${state.studentQuiz.topic || 'Lembar Kerja Siswa'}</p>
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-sm mb-6 text-left space-y-2">
                                <div>⏱️ <strong>Durasi Waktu:</strong> ${state.studentQuiz.time} Menit</div>
                                <div>📊 <strong>Jumlah Soal:</strong> ${state.studentQuiz.text.split('\n').filter(t=>t.trim()!=='').length} Pertanyaan</div>
                            </div>
                            <button onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-base">
                                Mulai Kerjakan Sekarang
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            // --- SISWA: PENGERJAAN UJIAN ---
            if (state.mode === 'student_exam') {
                const lines = state.studentQuiz.text.split('\n').filter(t => t.trim() !== '');
                const labels = ['A', 'B', 'C', 'D'];
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 pb-20">
                        <div class="sticky top-0 bg-white shadow-sm border-b border-slate-200 p-4 flex justify-between items-center z-50 max-w-4xl mx-auto px-6">
                            <div>
                                <h1 class="font-bold text-base text-slate-800">${state.studentQuiz.subject}</h1>
                                <p class="text-xs text-slate-500">${state.studentQuiz.topic}</p>
                            </div>
                            <div id="timer-display" class="font-mono text-xl font-bold px-4 py-1 rounded-full bg-slate-100 text-slate-700">
                                ${formatTime(state.timeRemaining)}
                            </div>
                        </div>
                        <div class="max-w-3xl mx-auto p-4 mt-6">
                            ${lines.map((line, idx) => {
                                const parts = line.split('|').map(p => p.trim());
                                const isMC = parts.length >= 5;
                                return `
                                    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
                                        <h3 class="text-base font-medium mb-4"><span class="mr-2 font-bold">${idx + 1}.</span> ${parts[0]}</h3>
                                        ${isMC ? `
                                            <div class="flex flex-col gap-2.5 ml-2">
                                                ${parts.slice(1, 5).map((opt, oIdx) => `
                                                    <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition ${state.studentAnswers[idx] === labels[oIdx] ? 'border-blue-500 bg-blue-50 font-medium' : 'border-slate-200 hover:bg-slate-50'}">
                                                        <input type="radio" name="q-${idx}" value="${labels[oIdx]}" 
                                                            ${state.studentAnswers[idx] === labels[oIdx] ? 'checked' : ''} 
                                                            onchange="state.studentAnswers[${idx}] = '${labels[oIdx]}'; render();" 
                                                            class="w-4 h-4 text-blue-600">
                                                        <span class="text-sm">${labels[oIdx]}. ${opt}</span>
                                                    </label>
                                                `).join('')}
                                            </div>
                                        ` : `
                                            <textarea rows="3" placeholder="Tuliskan jawaban Anda di sini..." 
                                                oninput="state.studentAnswers[${idx}] = this.value"
                                                class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                                        `}
                                    </div>
                                `;
                            }).join('')}
                            <button onclick="submitExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg">
                                ✅ Selesai & Kumpulkan Jawaban
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            // --- SISWA: HASIL SKOR ---
            if (state.mode === 'result') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-6xl mb-4">🏆</div>
                            <h1 class="text-3xl font-bold text-slate-800 mb-1">Ujian Selesai!</h1>
                            <p class="text-slate-500 text-sm mb-6">Terima kasih telah menyelesaikan lembar ujian.</p>
                            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 mb-6">
                                <div class="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1">Nilai Akhir</div>
                                <div class="text-6xl font-black text-blue-600 mb-2">${state.scoreResult.score}</div>
                                <div class="text-slate-600 text-sm">Benar <strong>${state.scoreResult.correct}</strong> dari <strong>${state.scoreResult.total}</strong> soal</div>
                            </div>
                            <p class="text-xs text-slate-400">Silakan Screenshot layar ini untuk dikirimkan ke Guru Anda.</p>
                        </div>
                    </div>
                `;
                return;
            }

            // --- MODE GURU: DASHBOARD PEMBUAT SOAL ---
            const activeTypeObj = QUESTION_TYPES.flatMap(c => c.items).find(i => i.id === state.type);
            const activeDisplayUrl = state.shortShareUrl || state.rawShareUrl;

            app.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    ${state.showModal ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex justify-center items-center p-4 modal-backdrop">
                            <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button onclick="state.showModal = false; render();" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                                
                                <h2 class="text-xl font-bold mb-1 text-slate-800">🌐 Link Kuis Super Pendek</h2>
                                <p class="text-slate-500 text-xs mb-4">Link telah dipotong otomatis menjadi sangat pendek agar mudah dikirim via WhatsApp.</p>

                                <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4 flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="text-lg">⚡</span>
                                        <div class="text-xs">
                                            <div class="font-bold text-blue-800">
                                                ${state.isShortening ? '⏳ Memotong link otomatis...' : (state.shortShareUrl ? 'Link Terpotong Super Pendek (~18 Karakter)' : 'Kompresi LZ-String Aktif')}
                                            </div>
                                            <div class="text-blue-600">${state.shortShareUrl ? 'Siap Bagikan ke Siswa' : `Ukuran hemat ~${state.compressedRatio}%`}</div>
                                        </div>
                                    </div>
                                    <span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                        ${state.shortShareUrl ? 'is.gd API' : 'LZ-String'}
                                    </span>
                                </div>

                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Link Kuis Siswa (Siap Pakai):</label>
                                    <input type="text" readonly value="${state.isShortening ? 'Sedang memproses link pendek...' : activeDisplayUrl}" class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-xs text-blue-600 font-bold font-mono outline-none">
                                </div>

                                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-4 flex flex-col items-center text-center">
                                    <span class="text-xs font-semibold text-slate-500 mb-2">Pindai QR Code via HP Siswa / Proyektor:</span>
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(activeDisplayUrl)}" 
                                         alt="QR Code Kuis" class="w-36 h-36 rounded-lg border border-slate-300 shadow-sm bg-white p-1">
                                </div>

                                <div class="space-y-2">
                                    <button onclick="copyLink()" ${state.isShortening ? 'disabled' : ''} class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-md flex justify-center items-center gap-2">
                                        <span>📋</span> Salin Link Kuis Pendek
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-3.5 flex justify-between items-center no-print sticky top-0 z-10">
                        <div class="flex items-center gap-2 text-blue-600 font-black text-xl tracking-tight">
                            <span>✏️</span> EduGenerator Pro <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-semibold">25 Tipe Soal</span>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="generateLink()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2 shadow-sm text-sm">
                                <span>🌐</span> Bagikan Online
                            </button>
                            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium transition flex items-center gap-2 shadow-sm text-sm">
                                <span>🖨️</span> Cetak Kertas (A4)
                            </button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
                        <aside class="w-full lg:w-[410px] bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col gap-4 shrink-0 h-fit no-print">
                            
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">📌 Informasi Materi Pembelajaran</h3>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">Mata Pelajaran</label>
                                    <input type="text" value="${state.subject}" oninput="state.subject = this.value; renderPreviewOnly();" 
                                        class="w-full border border-slate-300 rounded-lg p-2 text-sm font-medium outline-none focus:border-blue-500 bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-600 mb-1">Judul Materi / Bab</label>
                                    <input type="text" value="${state.topic}" oninput="state.topic = this.value; renderPreviewOnly();" 
                                        class="w-full border border-slate-300 rounded-lg p-2 text-sm font-medium outline-none focus:border-blue-500 bg-white">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">1. Pilih Tipe Soal (25 Jenis)</label>
                                <select onchange="setType(this.value)" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-medium bg-slate-50 outline-none focus:border-blue-500">
                                    ${QUESTION_TYPES.map(cat => `
                                        <optgroup label="${cat.category}">
                                            ${cat.items.map(item => `
                                                <option value="${item.id}" ${state.type === item.id ? 'selected' : ''}>${item.label}</option>
                                            `).join('')}
                                        </optgroup>
                                    `).join('')}
                                </select>
                            </div>

                            <button onclick="generate25Auto()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition text-sm flex justify-center items-center gap-2 shadow-sm">
                                <span>⚡</span> Generate 25 Soal Otomatis (${state.topic})
                            </button>

                            ${state.type === 'mc' ? `
                                <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl">
                                    <label class="block text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Durasi Kuis Online (Menit)</label>
                                    <input type="number" min="1" value="${state.timeLimit}" onchange="state.timeLimit = this.value" class="w-full border border-emerald-300 rounded-lg p-2 text-center font-bold text-emerald-900 bg-white outline-none">
                                </div>
                            ` : ''}

                            <div>
                                <div class="flex justify-between items-center mb-1.5">
                                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">2. Edit Isi Soal</label>
                                    <span class="text-[11px] text-blue-600 font-semibold">${state.text.split('\n').filter(t=>t.trim()!=='').length} Soal Terdeteksi</span>
                                </div>
                                <textarea rows="9" oninput="updateText(this.value)" class="w-full border border-slate-300 rounded-xl p-3 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-slate-50">${state.text}</textarea>
                            </div>

                            <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-xs text-blue-900 leading-relaxed">
                                💡 <strong>Format Tipe Ini:</strong><br>
                                <code>${activeTypeObj ? activeTypeObj.hint : ''}</code>
                            </div>
                        </aside>

                        <!-- PRATINJAU KERTAS A4 (Satu-satunya area yang akan dicetak) -->
                        <section class="flex-1 bg-slate-200 rounded-2xl p-4 md:p-8 flex justify-center items-start overflow-auto">
                            <div class="bg-white shadow-2xl a4-paper p-10 md:p-14 text-slate-900 print-area flex flex-col justify-between">
                                <div>
                                    <!-- KOP KERTAS -->
                                    <div class="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                                        <div>
                                            <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">${state.subject || 'MATA PELAJARAN'}</span>
                                            <h2 class="text-xl font-bold uppercase tracking-wider text-slate-900 mt-0.5">${state.topic || 'LEMBAR KERJA SISWA'}</h2>
                                            <p class="text-slate-500 text-xs mt-1">${state.instructions}</p>
                                        </div>
                                        <div class="w-56 text-xs space-y-1.5 text-slate-700">
                                            <div class="flex border-b border-slate-400 pb-0.5"><span class="w-16 font-semibold">Nama</span>:</div>
                                            <div class="flex border-b border-slate-400 pb-1"><span class="w-16 font-semibold">Kelas</span>:</div>
                                            <div class="flex border-b border-slate-400 pb-1"><span class="w-16 font-semibold">Nilai</span>:</div>
                                        </div>
                                    </div>

                                    <!-- KONTEN PREVIEW SOAL -->
                                    <div id="preview-content"></div>
                                </div>

                                <div class="mt-8 pt-3 border-t border-slate-200 flex justify-between text-[11px] text-slate-400">
                                    <span>EduGenerator Pro — ${state.subject}</span>
                                    <span>Halaman Kertas Soal</span>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            `;

            renderPreviewOnly();
        }

        window.onload = init;
    </script>
</body>
</html>
