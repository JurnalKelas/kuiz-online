<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenerator Pro - Ujian Online & Lembar Kerja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tambahan Library Kompresi untuk Memendekkan Link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
        }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body, #app, main, section {
                background: white !important; color: black !important; width: 100% !important; height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; position: static !important; display: block !important; box-shadow: none !important;
            }
            .no-print, header, aside, .modal-backdrop, button { display: none !important; }
            .print-area { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; border: none !important; display: block !important; }
            .page-break-inside-avoid { page-break-inside: avoid !important; break-inside: avoid !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div id="app"></div>

    <script>
        const QUESTION_TYPES = [
            {
                category: "Pilihan & Logika",
                items: [
                    { id: 'mc', label: '1. Pilihan Ganda (Multiple Choice)', hint: 'Soal | Opsi A | Opsi B | Opsi C | Opsi D | Kunci(A/B/C/D)' },
                    { id: 'tf', label: '2. Benar atau Salah (True / False)', hint: 'Pernyataan benar atau salah per baris' },
                    { id: 'tf_correct', label: '3. Benar/Salah + Alasan Pembetulan', hint: 'Pernyataan salah yang harus dikoreksi siswa' },
                    { id: 'odd_out', label: '4. Cari Kata Berbeda (Odd One Out)', hint: 'Kata1, Kata2, Kata3, KataBerbeda' },
                ]
            },
            {
                category: "Isian & Melengkapi",
                items: [
                    { id: 'fill', label: '5. Isian Singkat (Fill in the Blank)', hint: 'Kalimat dengan bagian kosong ________.' },
                    { id: 'cloze', label: '6. Teks Rumpang (Cloze Test)', hint: 'Paragraf cerita dengan titik-titik (1)_______' },
                    { id: 'short_answer', label: '7. Pertanyaan Singkat (Short Answer)', hint: 'Pertanyaan singkat per baris' },
                    { id: 'essay', label: '8. Uraian / Essay', hint: 'Pertanyaan essay yang membutuhkan penjelasan' },
                ]
            },
            {
                category: "Mencocokkan & Mengurutkan",
                items: [
                    { id: 'matching', label: '9. Menjodohkan (Matching)', hint: 'Sisi Kiri - Sisi Kanan' },
                    { id: 'sequencing', label: '10. Mengurutkan Kejadian (Sequencing)', hint: 'Langkah/kejadian acak per baris' },
                    { id: 'rearrange', label: '11. Menyusun Kata Acak (Rearrange Words)', hint: 'kata1 - kata2 - kata3 - kata4' },
                ]
            },
            {
                category: "Percakapan & Teks",
                items: [
                    { id: 'dialogue_comp', label: '12. Melengkapi Percakapan (Dialogue)', hint: 'A: Halo!\nB: ________' },
                    { id: 'dialogue_order', label: '13. Mengurutkan Dialog Acak', hint: 'Kalimat percakapan yang diacak' },
                    { id: 'reading', label: '14. Pemahaman Bacaan (Reading Text)', hint: 'Teks Bacaan...\n---\nSoal 1\nSoal 2' },
                ]
            },
            {
                category: "Grammar & Kosakata",
                items: [
                    { id: 'error_id', label: '15. Identifikasi Kesalahan Kalimat', hint: 'Kalimat dengan kata salah dalam [kurung]' },
                    { id: 'transform', label: '16. Transformasi Kalimat', hint: 'Kalimat dasar (Instruksi perubahan)' },
                    { id: 'word_form', label: '17. Pembentukan Kata (Word Form)', hint: 'Kalimat ________ (kata dasar)' },
                    { id: 'syn_ant', label: '18. Sinonim & Antonim', hint: 'Kata Utama - [Sinonim / Antonim]' },
                    { id: 'vocab', label: '19. Kosakata & Definisi', hint: 'Kosakata : Definisi singkat' },
                    { id: 'word_search', label: '20. Acak Kata / Anagram', hint: 'KATAACAK (Kata Asli)' },
                ]
            },
            {
                category: "Media & Soal Spesial",
                items: [
                    { id: 'picture', label: '21. Soal Berbasis Gambar', hint: 'Pertanyaan pengamatan gambar' },
                    { id: 'listening', label: '22. Soal Menyimak (Listening)', hint: 'Pertanyaan berdasarkan audio track' },
                    { id: 'speaking', label: '23. Instruksi Bicara (Speaking Test)', hint: 'Topik / Tugas bicara siswa' },
                    { id: 'info_gap', label: '24. Melengkapi Tabel Informasi', hint: 'Data1 - Data2 - Data3 (Gunakan ____)' },
                    { id: 'math_logic', label: '25. Soal Cerita Matematika / Logika', hint: 'Soal hitungan atau penalaran matematika' },
                ]
            }
        ];

        let state = {
            mode: 'teacher',
            type: 'mc',
            subject: 'Bahasa Indonesia',
            topic: 'Struktur Teks dan Pemahaman Bacaan',
            instructions: 'Jawablah pertanyaan-pertanyaan di bawah ini dengan teliti dan benar!',
            text: '',
            timeLimit: 15,
            teacherWhatsApp: '628123456789',
            rawShareUrl: '',
            showModal: false,
            studentQuiz: null,
            studentName: '',
            studentClass: '',
            studentAnswers: {},
            timeRemaining: 0,
            timerInterval: null,
            scoreResult: null
        };

        window.appState = state;

        function generateSmartQuestions() {
            const subject = state.subject || 'Pelajaran';
            const topic = state.topic || 'Materi';
            const type = state.type;

            let lines = [];
            for (let i = 1; i <= 25; i++) {
                if (type === 'mc') {
                    lines.push(`Pertanyaan ${i} mengenai konsep dasar ${topic} dalam mata pelajaran ${subject}? | Pilihan A yang tepat | Pilihan B alternatif | Pilihan C pengecoh | Pilihan D pengecoh | A`);
                } else if (type === 'matching') {
                    lines.push(`Istilah kunci ${i} (${topic}) - Pasangan definisi yang sesuai untuk nomor ${i}`);
                } else if (type === 'tf') {
                    lines.push(`Pernyataan ${i} terkait materi ${topic} bernilai benar atau salah.`);
                } else {
                    lines.push(`Jelaskan secara ringkas mengenai konsep nomor ${i} pada materi ${topic}?`);
                }
            }
            state.text = lines.join('\n');
        }

        window.generate25Auto = function() {
            generateSmartQuestions();
            render();
        };

        function init() {
            const params = new URLSearchParams(window.location.search);
            const targetQ = params.get('q');
            
            let decodedObj = null;
            if (targetQ) {
                try {
                    // Dekompresi data link agar aman dan tidak terpotong
                    const decompressed = LZString.decompressFromEncodedURIComponent(targetQ);
                    if (!decompressed) throw new Error("Data terpotong");
                    decodedObj = JSON.parse(decompressed);
                } catch (e) {
                    console.error("Gagal dekode:", e);
                    alert("⚠️ Maaf, link kuis ini tidak valid atau terpotong saat dibagikan. Silakan minta guru Anda mengirim ulang link yang lengkap.");
                    // Kembalikan ke halaman utama jika link rusak
                    window.location.href = window.location.origin + window.location.pathname;
                    return;
                }
            }

            if (decodedObj) {
                state.studentQuiz = decodedObj;
                state.timeRemaining = (decodedObj.time || 15) * 60;
                state.mode = 'student_start';
            } else {
                generateSmartQuestions();
            }
            
            render();
        }

        window.setType = function(type) {
            state.type = type;
            generateSmartQuestions();
            render();
        };

        window.updateText = function(val) {
            state.text = val;
            renderPreviewOnly();
        };

        window.generateLink = function() {
            const quizPayload = {
                type: state.type,
                subject: state.subject,
                topic: state.topic,
                text: state.text,
                time: Number(state.timeLimit) || 15,
                wa: state.teacherWhatsApp.replace(/[^0-9]/g, '')
            };
            
            // Kompresi tingkat tinggi agar URL pendek dan kebal pemotongan WhatsApp
            const compressedStr = LZString.compressToEncodedURIComponent(JSON.stringify(quizPayload));
            
            let baseUrl = window.location.origin + window.location.pathname;
            state.rawShareUrl = `${baseUrl}?q=${compressedStr}`;
            state.showModal = true;
            render();
        };

        window.copyLink = function() {
            const input = document.createElement('textarea');
            input.value = state.rawShareUrl;
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                const msg = document.getElementById('copy-feedback');
                if (msg) msg.innerText = '✅ Link berhasil disalin!';
            } catch (err) {
                alert('Gagal menyalin link.');
            }
            document.body.removeChild(input);
        };

        window.triggerPrint = function() {
            window.print();
        };

        window.startExam = function() {
            if (!state.studentName.trim() || !state.studentClass.trim()) {
                const errBox = document.getElementById('exam-error');
                if (errBox) errBox.innerText = "Harap masukkan Nama dan Kelas Anda!";
                return;
            }
            state.mode = 'student_exam';
            render();
            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                if (state.timeRemaining <= 0) {
                    clearInterval(state.timerInterval);
                    window.submitExam();
                } else {
                    const timerEl = document.getElementById('timer-display');
                    if (timerEl) {
                        const m = Math.floor(state.timeRemaining / 60);
                        const s = state.timeRemaining % 60;
                        timerEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    }
                }
            }, 1000);
        };

        window.submitExam = function() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            const lines = state.studentQuiz.text.split('\n').filter(l => l.trim() !== '');
            let correct = 0;
            let totalEval = 0;

            lines.forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                    totalEval++;
                    if (state.studentAnswers[idx] === parts[5].toUpperCase()) correct++;
                }
            });

            const total = totalEval > 0 ? totalEval : lines.length;
            state.scoreResult = { correct, total, score: total > 0 ? Math.round((correct / total) * 100) : 100 };
            state.mode = 'result';
            render();
        };

        window.sendScoreToWhatsApp = function() {
            const msg = `Halo Guru, saya telah menyelesaikan kuis:\n\n👤 Nama: ${state.studentName}\n🏫 Kelas: ${state.studentClass}\n📚 Mapel: ${state.studentQuiz.subject}\n🏆 Nilai Akhir: *${state.scoreResult.score}* (Benar ${state.scoreResult.correct} dari ${state.scoreResult.total})`;
            window.open(`https://wa.me/${state.studentQuiz.wa}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        function renderPreviewOnly() {
            const container = document.getElementById('preview-content');
            if (!container) return;

            const lines = state.text.split('\n').filter(t => t.trim() !== '');
            const labels = ['A', 'B', 'C', 'D'];
            let html = '';

            lines.forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (state.type === 'mc' && parts.length >= 5) {
                    html += `
                        <div class="mb-4 text-sm page-break-inside-avoid">
                            <div class="flex gap-2 font-medium mb-1">
                                <span>${idx + 1}.</span>
                                <span class="flex-1">${parts[0]}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-y-1.5 ml-5 text-xs text-slate-700">
                                ${parts.slice(1, 5).map((opt, oIdx) => `
                                    <div class="flex items-center gap-2">
                                        <span class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[10px] font-bold">${labels[oIdx]}</span>
                                        <span>${opt}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="mb-3 text-sm flex gap-2 page-break-inside-avoid">
                            <span class="font-bold shrink-0">${idx + 1}.</span>
                            <span class="flex-1">${line.split('|')[0]}</span>
                        </div>
                    `;
                }
            });
            container.innerHTML = html;
        }

        window.render = function() {
            const app = document.getElementById('app');

            if (state.mode === 'student_start') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-5xl mb-3">📝</div>
                            <h1 class="text-2xl font-bold mb-1 text-slate-800">${state.studentQuiz.subject}</h1>
                            <p class="text-blue-600 font-medium text-sm mb-4">${state.studentQuiz.topic}</p>
                            
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl text-sm mb-4 text-left space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap:</label>
                                    <input type="text" value="${state.studentName}" oninput="window.appState.studentName = this.value" placeholder="Nama Siswa" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-600 mb-1">Kelas:</label>
                                    <input type="text" value="${state.studentClass}" oninput="window.appState.studentClass = this.value" placeholder="Kelas" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white outline-none">
                                </div>
                                <div id="exam-error" class="text-xs text-red-600 font-bold"></div>
                            </div>

                            <button onclick="window.startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg">
                                Mulai Ujian
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.mode === 'student_exam') {
                const lines = state.studentQuiz.text.split('\n').filter(t => t.trim() !== '');
                const labels = ['A', 'B', 'C', 'D'];
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 pb-20">
                        <div class="sticky top-0 bg-white shadow-sm border-b p-4 flex justify-between items-center z-50 max-w-4xl mx-auto px-6">
                            <div>
                                <h1 class="font-bold text-base text-slate-800">${state.studentQuiz.subject} (${state.studentName} - ${state.studentClass})</h1>
                            </div>
                            <div id="timer-display" class="font-mono text-xl font-bold px-4 py-1 rounded-full bg-slate-100 text-slate-700">
                                0:00
                            </div>
                        </div>
                        <div class="max-w-3xl mx-auto p-4 mt-6">
                            ${lines.map((line, idx) => {
                                const parts = line.split('|').map(p => p.trim());
                                const isMC = parts.length >= 5;
                                return `
                                    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
                                        <h3 class="text-base font-medium mb-4"><span class="mr-2 font-bold">${idx + 1}.</span> ${parts[0]}</h3>
                                        ${isMC ? `
                                            <div class="flex flex-col gap-2.5 ml-2">
                                                ${parts.slice(1, 5).map((opt, oIdx) => `
                                                    <label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer ${state.studentAnswers[idx] === labels[oIdx] ? 'border-blue-500 bg-blue-50 font-medium' : 'border-slate-200'}">
                                                        <input type="radio" name="q-${idx}" value="${labels[oIdx]}" 
                                                            ${state.studentAnswers[idx] === labels[oIdx] ? 'checked' : ''} 
                                                            onchange="window.appState.studentAnswers[${idx}] = '${labels[oIdx]}'; window.render();">
                                                        <span class="text-sm">${labels[oIdx]}. ${opt}</span>
                                                    </label>
                                                `).join('')}
                                            </div>
                                        ` : `
                                            <textarea rows="3" oninput="window.appState.studentAnswers[${idx}] = this.value" class="w-full border rounded-xl p-3 text-sm"></textarea>
                                        `}
                                    </div>
                                `;
                            }).join('')}
                            <button onclick="window.submitExam()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg">
                                Selesai & Kumpulkan Jawaban
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (state.mode === 'result') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                            <div class="text-6xl mb-4">🏆</div>
                            <h1 class="text-3xl font-bold text-slate-800 mb-1">Ujian Selesai!</h1>
                            <div class="bg-slate-50 border rounded-2xl p-6 mb-6">
                                <div class="text-6xl font-black text-blue-600 mb-2">${state.scoreResult.score}</div>
                                <div class="text-slate-600 text-sm">Benar <strong>${state.scoreResult.correct}</strong> dari <strong>${state.scoreResult.total}</strong> soal</div>
                            </div>
                            <button onclick="window.sendScoreToWhatsApp()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg">
                                Kirim Nilai ke WhatsApp Guru
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            app.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    ${state.showModal ? `
                        <div class="fixed inset-0 bg-black/50 z-50 flex justify-center items-center p-4 modal-backdrop">
                            <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative">
                                <button onclick="window.appState.showModal = false; window.render();" class="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                                <h2 class="text-xl font-bold mb-1">Link Kuis Siswa</h2>
                                <p class="text-xs text-slate-500 mb-4">Link sekarang sudah dikompresi (sangat pendek dan dijamin bisa dibuka)!</p>
                                <input type="text" readonly value="${state.rawShareUrl}" class="w-full bg-slate-100 border rounded-xl p-3 text-xs text-blue-600 font-mono mb-4">
                                <button onclick="window.copyLink()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">Salin Link Kuis</button>
                                <div id="copy-feedback" class="text-center text-xs font-bold text-emerald-600 mt-2"></div>
                            </div>
                        </div>
                    ` : ''}

                    <header class="bg-white shadow-sm border-b px-6 py-3.5 flex justify-between items-center no-print sticky top-0 z-10">
                        <div class="font-black text-xl text-blue-600">✏️ EduGenerator Pro</div>
                        <div class="flex gap-3">
                            <button onclick="window.generateLink()" class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm">Bagikan Online</button>
                            <button onclick="window.triggerPrint()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm">Cetak Kertas</button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
                        <aside class="w-full lg:w-[410px] bg-white rounded-2xl border p-5 flex flex-col gap-4 h-fit no-print">
                            <div class="bg-slate-50 p-4 rounded-xl border space-y-3">
                                <h3 class="text-xs font-bold text-slate-500 uppercase">Informasi Guru & Materi</h3>
                                <div>
                                    <label class="block text-xs font-medium mb-1">No. WhatsApp Guru</label>
                                    <input type="text" value="${state.teacherWhatsApp}" oninput="window.appState.teacherWhatsApp = this.value" class="w-full border rounded-lg p-2 text-sm bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1">Mata Pelajaran</label>
                                    <input type="text" value="${state.subject}" oninput="window.appState.subject = this.value; renderPreviewOnly();" class="w-full border rounded-lg p-2 text-sm bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium mb-1">Judul Materi / Bab</label>
                                    <input type="text" value="${state.topic}" oninput="window.appState.topic = this.value; renderPreviewOnly();" class="w-full border rounded-lg p-2 text-sm bg-white">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Pilih Tipe Soal</label>
                                <select onchange="window.setType(this.value)" class="w-full border rounded-xl p-2.5 text-sm bg-slate-50">
                                    ${QUESTION_TYPES.map(cat => `
                                        <optgroup label="${cat.category}">
                                            ${cat.items.map(item => `<option value="${item.id}" ${state.type === item.id ? 'selected' : ''}>${item.label}</option>`).join('')}
                                        </optgroup>
                                    `).join('')}
                                </select>
                            </div>

                            <button onclick="window.generate25Auto()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-sm">
                                ⚡ Generate 25 Soal Otomatis
                            </button>

                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Edit Isi Soal</label>
                                <textarea rows="7" oninput="window.updateText(this.value)" class="w-full border rounded-xl p-3 text-xs font-mono bg-slate-50 mt-1">${state.text}</textarea>
                            </div>
                        </aside>

                        <section class="flex-1 bg-slate-200 rounded-2xl p-4 md:p-8 flex justify-center items-start overflow-auto">
                            <div class="bg-white shadow-2xl a4-paper p-10 text-slate-900 print-area flex flex-col justify-between">
                                <div>
                                    <div class="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                                        <div>
                                            <span class="text-xs font-bold text-blue-600 uppercase">${state.subject}</span>
                                            <h2 class="text-xl font-bold uppercase mt-0.5">${state.topic}</h2>
                                        </div>
                                        <div class="w-56 text-xs space-y-1.5">
                                            <div class="flex border-b pb-0.5"><span class="w-16 font-semibold">Nama</span>:</div>
                                            <div class="flex border-b pb-1"><span class="w-16 font-semibold">Kelas</span>:</div>
                                        </div>
                                    </div>
                                    <div id="preview-content"></div>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            `;
            renderPreviewOnly();
        }

        window.onload = init;
    </script>
</body>
</html>
